  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    padding: 48px 32px 80px;
  }

  header {
    margin-bottom: 40px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: #111;
  }

  .count {
    font-size: 0.8rem;
    color: #aaa;
    font-weight: 400;
  }


  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px 24px;
    max-width: 960px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card:hover .thumb-wrap {
    opacity: 0.88;
  }

  .card:hover .title {
    color: #555;
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #f0f0f0;
    overflow: hidden;
    border-radius: 2px;
    transition: opacity 0.15s;
  }

  .thumb-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    transition: opacity 0.2s;
  }

  .thumb-wrap img.loaded {
    display: block;
  }

  .thumb-placeholder {
    position: absolute;
    inset: 0;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .thumb-placeholder::after {
    content: '';
    width: 28px;
    height: 28px;
    border: 2px solid #ddd;
    border-top-color: #bbb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .thumb-placeholder.done::after {
    display: none;
  }

  .meta {
    padding: 8px 0 0;
  }

  .year-tag {
    font-size: 0.62rem;
    color: #bbb;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .title {
    font-size: 0.9rem;
    font-weight: 500;
    color: #111;
    transition: color 0.15s;
  }

  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 32px 16px 60px; }
  }
</style>

const grid = document.getElementById('grid');

playlists.forEach((p, i) => {
  const card = document.createElement('a');
  card.className = 'card';
  card.href = p.url;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.dataset.listId = p.id;
  card.dataset.index = i;
  card.innerHTML = `
    <div class="thumb-wrap">
      <div class="thumb-placeholder"></div>
      <img src="" alt="${p.label} ${p.year}">
    </div>
    <div class="meta">
      <div class="year-tag">${p.year}</div>
      <div class="title">${p.label}</div>
    </div>
  `;
  grid.appendChild(card);
});

// ── Lazy loader ──────────────────────────────────────────────
// Batches of 50 (YouTube API max). Fetches a batch when any
// card in that batch enters the viewport.

const BATCH_SIZE = 50;
const batches = [];
for (let i = 0; i < playlists.length; i += BATCH_SIZE) {
  batches.push(playlists.slice(i, i + BATCH_SIZE));
}

const fetchedBatches = new Set();

function fetchBatch(batchIndex) {
  if (fetchedBatches.has(batchIndex)) return;
  fetchedBatches.add(batchIndex);

  const batch = batches[batchIndex];
  const ids = batch.map(p => p.id).join(',');
  const url = `https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${ids}&maxResults=50&key=${API_KEY}`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.items) return;

      const thumbMap = {};
      data.items.forEach(item => {
        const t = item.snippet.thumbnails;
        const src = (t.maxres || t.standard || t.high || t.medium || t.default || {}).url;
        if (src) thumbMap[item.id] = src;
      });

      // Inject into cards for this batch
      const start = batchIndex * BATCH_SIZE;
      const end = start + batch.length;
      const cards = [...document.querySelectorAll('.card')];
      cards.slice(start, end).forEach(card => {
        const src = thumbMap[card.dataset.listId];
        const ph = card.querySelector('.thumb-placeholder');
        ph.classList.add('done');
        if (!src) return;
        const img = card.querySelector('img');
        img.onload = () => img.classList.add('loaded');
        img.src = src;
      });
    })
    .catch(err => console.error('API error:', err));
}

// IntersectionObserver — reveals cards and triggers batch fetch
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const card = entry.target;
    card.classList.add('visible');

    const index = parseInt(card.dataset.index);
    const batchIndex = Math.floor(index / BATCH_SIZE);
    fetchBatch(batchIndex);

    observer.unobserve(card);
  });
}, {
  rootMargin: '200px 0px', // start loading 200px before entering view
  threshold: 0
});

document.querySelectorAll('.card').forEach(card => observer.observe(card));

// Always fetch the first batch immediately
fetchBatch(0);
