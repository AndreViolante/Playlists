<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Bobby's Cosmopolitan Lifestyle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-dim: #8a6e2f;
    --white: #f0ece4;
    --white-dim: #7a7268;
    --bg: #0a0a0a;
    --card-bg: #111111;
    --card-border: rgba(255,255,255,0.07);
  }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Libre Baskerville', Georgia, serif;
    min-height: 100vh;
    padding: 0 0 100px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 72px 24px 56px;
  }

  header h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.2rem, 3vw, 2.4rem);
    font-weight: 400;
    color: var(--white);
    letter-spacing: 0.1em;
    line-height: 1.3;
  }

  header .subtitle {
    margin-top: 14px;
    font-size: 0.68rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--white-dim);
    font-family: 'Libre Baskerville', serif;
  }

  /* ── Main ── */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ── Year section ── */
  .year-section {
    margin-top: 64px;
  }

  .year-heading {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.85rem, 2vw, 1.3rem);
    font-weight: 400;
    color: var(--gold);
    margin-bottom: 32px;
    letter-spacing: 0.15em;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(201,168,76,0.2);
  }

  /* ── Grid ── */
  .playlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
  }

  /* ── Card ── */
  .playlist-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s;
  }

  .playlist-card:hover {
    border-color: rgba(201,168,76,0.25);
  }

  /* ── Thumbnail ── */
  .thumb-link {
    display: block;
    text-decoration: none;
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #1a1a1a;
    overflow: hidden;
  }

  .thumb-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.2s;
  }

  .thumb-wrap.no-img {
    background: #1a1a1a;
  }

  .thumb-wrap.no-img img {
    display: none;
  }

  /* Play button overlay */
  .play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 48px; height: 48px;
    background: rgba(0,0,0,0.65);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--white);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .thumb-link:hover .play-btn {
    opacity: 1;
  }

  .thumb-link:hover img {
    opacity: 0.85;
  }

  /* ── Card label ── */
  .card-label {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    color: var(--gold);
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--card-border);
  }

  /* ── Tracklist ── */
  .tracklist {
    list-style: none;
    padding: 8px 0 12px;
    overflow-y: auto;
    max-height: 220px;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .tracklist::-webkit-scrollbar { width: 3px; }
  .tracklist::-webkit-scrollbar-track { background: transparent; }
  .tracklist::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
  }

  .tracklist li {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 3px 14px;
    transition: background 0.15s;
  }

  .tracklist li:hover {
    background: rgba(255,255,255,0.03);
  }

  .track-num {
    font-size: 0.58rem;
    color: var(--white-dim);
    min-width: 16px;
    text-align: right;
    flex-shrink: 0;
    font-family: 'Libre Baskerville', serif;
  }

  .track-title {
    font-size: 0.68rem;
    color: rgba(240,236,228,0.72);
    line-height: 1.45;
    font-family: 'Libre Baskerville', serif;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    margin-top: 80px;
  }

  footer p {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.15);
    font-family: 'Libre Baskerville', serif;
  }

  @media (max-width: 600px) {
    main { padding: 0 16px; }
    .playlist-grid { grid-template-columns: 1fr; gap: 20px; }
  }
</style>
</head>
<body>

<header>
  <h1>Bobby's Cosmopolitan Lifestyle</h1>
  <p class="subtitle">A Restaurant of Music</p>
</header>

<main id="main-content"></main>

<footer>
  <p>Bobby's Cosmopolitan Lifestyle &nbsp;·&nbsp; Updated monthly</p>
</footer>

<script>
async function fetchPlaylistsData() {
  try {
    const response = await fetch('playlists.json');
    return await response.json();
  } catch (error) {
    console.error('Error loading playlists:', error);
    return { playlists: [] };
  }
}

async function getYouTubeThumbnail(playlistUrl) {
  try {
    const oembedUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent(playlistUrl)}&format=json`;
    const response = await fetch(oembedUrl);
    const data = await response.json();
    return data.thumbnail_url;
  } catch (error) {
    console.error('Error fetching oEmbed data:', error);
    return null;
  }
}

function groupPlaylistsByYear(playlists) {
  const grouped = {};
  playlists.forEach(playlist => {
    if (!grouped[playlist.year]) {
      grouped[playlist.year] = [];
    }
    grouped[playlist.year].push(playlist);
  });
  
  // Sort years descending, and playlists within each year in order
  return Object.entries(grouped)
    .sort(([yearA], [yearB]) => parseInt(yearB) - parseInt(yearA))
    .map(([year, playlists]) => ({ year: parseInt(year), playlists }));
}

function createPlaylistCard(playlist) {
  const tracksHtml = playlist.tracks
    .map((track, index) => `
      <li>
        <span class="track-num">${index + 1}</span>
        <span class="track-title">${track}</span>
      </li>
    `)
    .join('');

  return `
    <div class="playlist-card">
      <a href="${playlist.url}" target="_blank" class="thumb-link" title="Open playlist on YouTube">
        <div class="thumb-wrap">
          <img src="" 
               alt="${playlist.label}"
               referrerpolicy="no-referrer"
               onerror="this.parentElement.classList.add('no-img')"
               loading="lazy"
               data-playlist-url="${playlist.url}">
          <div class="play-btn">&#9654;</div>
        </div>
      </a>
      <div class="card-label">${playlist.label}</div>
      <ol class="tracklist">
        ${tracksHtml}
      </ol>
    </div>
  `;
}

function createYearSection(year, playlists) {
  const cardsHtml = playlists
    .map(createPlaylistCard)
    .join('');

  return `
    <section class="year-section">
      <h2 class="year-heading">${year}</h2>
      <div class="playlist-grid">
        ${cardsHtml}
      </div>
    </section>
  `;
}

async function renderSite() {
  const data = await fetchPlaylistsData();
  const groupedByYear = groupPlaylistsByYear(data.playlists);
  
  const mainContent = document.getElementById('main-content');
  mainContent.innerHTML = groupedByYear
    .map(({ year, playlists }) => createYearSection(year, playlists))
    .join('');

  // Fetch thumbnails for all playlist images
  const images = document.querySelectorAll('img[data-playlist-url]');
  for (const img of images) {
    const url = img.getAttribute('data-playlist-url');
    const thumbnail = await getYouTubeThumbnail(url);
    if (thumbnail) {
      img.src = thumbnail;
    } else {
      img.parentElement.classList.add('no-img');
    }
  }
}

// Render the site when DOM is ready
document.addEventListener('DOMContentLoaded', renderSite);
</script>

</body>
</html>
