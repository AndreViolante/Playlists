<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant of Music</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    padding: 48px 32px 80px;
  }

  header {
    margin-bottom: 40px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #111;
  }

  h1 span {
    font-weight: 300;
    color: #888;
    font-size: 0.9rem;
    margin-left: 12px;
    letter-spacing: 0.06em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 960px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }

  .card:hover .thumb-wrap {
    opacity: 0.85;
  }

  .card:hover .title {
    color: #555;
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #f2f2f2;
    overflow: hidden;
    transition: opacity 0.2s;
  }

  .thumb-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .thumb-wrap img.loaded {
    display: block;
  }

  .thumb-placeholder {
    position: absolute;
    inset: 0;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .thumb-placeholder svg {
    opacity: 0.2;
  }

  .meta {
    padding: 10px 0 0;
  }

  .year-tag {
    font-size: 0.68rem;
    color: #aaa;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .title {
    font-size: 0.95rem;
    font-weight: 500;
    color: #111;
    transition: color 0.15s;
  }

  .loading-state {
    font-size: 0.7rem;
    color: #bbb;
    margin-top: 32px;
    letter-spacing: 0.05em;
  }

  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Restaurant of Music <span>Recent Playlists</span></h1>
</header>

<div class="grid" id="grid"></div>
<p class="loading-state" id="status">Loading thumbnails...</p>

<script>
const API_KEY = 'YOUR_API_KEY_HERE';

const playlists = [
  { id: 'PLs2RfrJzU5ylXpq5mPZ4xUoQk8Jc7CpGV', label: 'March',     year: 2026, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ylXpq5mPZ4xUoQk8Jc7CpGV' },
  { id: 'PLs2RfrJzU5ylN99Z-9AuSsSjNECPhuN1r', label: 'February',   year: 2026, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ylN99Z-9AuSsSjNECPhuN1r' },
  { id: 'PLs2RfrJzU5yk-qu1XCnqlgWxH3RUWRwvv', label: 'January',    year: 2026, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5yk-qu1XCnqlgWxH3RUWRwvv' },
  { id: 'PLs2RfrJzU5ynay9ca86NW7_tC77k7BaCH', label: 'December',   year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ynay9ca86NW7_tC77k7BaCH' },
  { id: 'PLs2RfrJzU5ymOLGTSjpjlsp4Aedv3lpXK', label: 'November',   year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ymOLGTSjpjlsp4Aedv3lpXK' },
  { id: 'PLs2RfrJzU5ynrPkDRH-R9PpEsu6gBEMDC', label: 'October',    year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ynrPkDRH-R9PpEsu6gBEMDC' },
  { id: 'PLs2RfrJzU5yk9rL5IrHSnY_Eh1GCVPynR', label: 'September',  year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5yk9rL5IrHSnY_Eh1GCVPynR' },
  { id: 'PLs2RfrJzU5ymiQ_qhunGL6OSLYNjemCrI', label: 'August',     year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ymiQ_qhunGL6OSLYNjemCrI' },
  { id: 'PLs2RfrJzU5ykFOlsjMQ1KJQsErxIFMoTr', label: 'July',       year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ykFOlsjMQ1KJQsErxIFMoTr' },
  { id: 'PLs2RfrJzU5ymlZNundsx3leDMO8Ja1koU', label: 'June',       year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ymlZNundsx3leDMO8Ja1koU' },
  { id: 'PLs2RfrJzU5ymBGLHLGxl0IZPObORqamPk', label: 'May',        year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ymBGLHLGxl0IZPObORqamPk' },
  { id: 'PLs2RfrJzU5ymTI4S38bUAm7G9ijNNPohQ', label: 'April',      year: 2025, url: 'https://www.youtube.com/playlist?list=PLs2RfrJzU5ymTI4S38bUAm7G9ijNNPohQ' },
];

// Build the grid cards immediately — thumbnails fill in after API call
const grid = document.getElementById('grid');
playlists.forEach(p => {
  const card = document.createElement('a');
  card.className = 'card';
  card.href = p.url;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.dataset.listId = p.id;
  card.innerHTML = `
    <div class="thumb-wrap">
      <div class="thumb-placeholder">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="#111">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <img src="" alt="${p.label} ${p.year}">
    </div>
    <div class="meta">
      <div class="year-tag">${p.year}</div>
      <div class="title">${p.label}</div>
    </div>
  `;
  grid.appendChild(card);
});

// Fetch all 12 playlist thumbnails in one API call
const ids = playlists.map(p => p.id).join(',');
const apiUrl = `https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${ids}&maxResults=12&key=${API_KEY}`;

fetch(apiUrl)
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      document.getElementById('status').textContent = 'API error: ' + data.error.message;
      return;
    }

    // Map list ID -> thumbnail URL
    const thumbMap = {};
    (data.items || []).forEach(item => {
      const thumbs = item.snippet.thumbnails;
      // Use highest available resolution
      const url = (thumbs.maxres || thumbs.standard || thumbs.high || thumbs.medium || thumbs.default || {}).url;
      if (url) thumbMap[item.id] = url;
    });

    // Inject thumbnails into cards
    document.querySelectorAll('.card[data-list-id]').forEach(card => {
      const src = thumbMap[card.dataset.listId];
      if (!src) return;
      const img = card.querySelector('img');
      const ph = card.querySelector('.thumb-placeholder');
      img.onload = () => {
        img.classList.add('loaded');
        if (ph) ph.style.display = 'none';
      };
      img.src = src;
    });

    document.getElementById('status').textContent = '';
  })
  .catch(err => {
    document.getElementById('status').textContent = 'Failed to load thumbnails.';
    console.error(err);
  });
</script>

</body>
</html>
